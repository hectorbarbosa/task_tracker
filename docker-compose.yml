# Full stack: api + MySQL + Redis. Used for final delivery / review.
# For local development use `docker-compose.dev.yml` (infra only) + run Go natively.

services:
  api:
    build: .
    container_name: task_tracker_api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: "8080"
      APP_ENV: "production"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DOCKER_DB_USER:-task_user}
      DB_PASS: ${DOCKER_DB_PASS:-task_pass}
      DB_NAME: ${DOCKER_DB_NAME:-task_tracker}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: task_tracker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
      MYSQL_DATABASE: ${DOCKER_DB_NAME:-task_tracker}
      MYSQL_USER: ${DOCKER_DB_USER:-task_user}
      MYSQL_PASSWORD: ${DOCKER_DB_PASS:-task_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-root_pass}", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: task_tracker_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
